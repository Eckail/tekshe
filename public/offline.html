<!doctype html>
<html lang="kk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#F3EDE1">
    <title>Желі жоқ · Tekshe</title>
    <style>
      :root { color-scheme: light; font-family: Arial, sans-serif; background: #F3EDE1; color: #242321; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(100%, 480px); border-top: 3px solid #B85F3D; padding: 28px 0; }
      .mark { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 10px; background: #242321; color: #F3EDE1; font-size: 22px; font-weight: 700; }
      h1 { margin: 28px 0 12px; font-size: clamp(28px, 8vw, 40px); line-height: 1.12; }
      p { color: #5d5952; line-height: 1.7; }
      a { display: inline-block; margin-top: 16px; padding: 13px 18px; border-radius: 8px; background: #242321; color: white; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">T</div>
      <h1>Интернет байланысы жоқ</h1>
      <p>Бұл бет тек желі болмаған жағдайда көрсетіледі. Байланыс қалпына келген соң, сабағыңызды жалғастыру үшін қайта ашыңыз.</p>
      <a href="/">Қайта көру</a>
    </main>
  </body>
</html>
